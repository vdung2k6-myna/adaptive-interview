<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Adaptive Interview Engine</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #171717;
        --muted: #737373;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
      }
      .card {
        max-width: 24rem;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 2rem;
        height: 2rem;
        fill: white;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .retry {
        margin-top: 1.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid #d4d4d8;
        background: transparent;
        color: var(--fg);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      .retry:hover {
        background: rgba(0, 0, 0, 0.04);
      }
      @media (prefers-color-scheme: dark) {
        .retry {
          border-color: #3f3f46;
        }
        .retry:hover {
          background: rgba(255, 255, 255, 0.06);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4h16v12H7.17L4 19V4z" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Please reconnect to the internet to continue your interview or review
        sessions.
      </p>
      <button class="retry" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
